name: PGM Artifact Tests

on:
  pull_request:
    paths:
      - 'scripts/sync_pgm_artifacts.py'
      - 'tests/test_pgm_sync.py'
      - '.github/workflows/*pgm-artifacts.yml'
      - '.github/PGM_ARTIFACT_SYNC.md'
      - 'legacy/README.md'
      - 'scripts/pgm_release.py'
      - 'tests/test_pgm_release.py'
      - '.github/workflows/pgm-release.yml'
      - '.github/PGM_WEEKLY_RELEASE.md'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_pgm_artifacts.py'
      - 'tests/test_pgm_sync.py'
      - '.github/workflows/*pgm-artifacts.yml'
      - '.github/PGM_ARTIFACT_SYNC.md'
      - 'legacy/README.md'
      - 'scripts/pgm_release.py'
      - 'tests/test_pgm_release.py'
      - '.github/workflows/pgm-release.yml'
      - '.github/PGM_WEEKLY_RELEASE.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test artifact synchronization and releases
        run: python3 -B -m unittest discover -s tests -p 'test_pgm*.py' -v
