name: PGM Artifact Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: write

concurrency:
  group: pgm-artifact-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preservation repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Test synchronization safety
        run: python3 -B -m unittest discover -s tests -p 'test_pgm_sync.py' -v
      - name: Synchronize validated artifacts
        env:
          PGM_SOURCE_URL: ${{ secrets.PGM_SOURCE_URL }}
          GIT_TERMINAL_PROMPT: '0'
        run: python3 -B scripts/sync_pgm_artifacts.py
