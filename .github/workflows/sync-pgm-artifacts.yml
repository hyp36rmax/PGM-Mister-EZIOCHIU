name: PGM Artifact Sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the changes after reviewing a preview'
        type: boolean
        default: false
      expected_mra_removals:
        description: 'MRA Removed count from the reviewed preview'
        type: number
        default: 0
      expected_core_removals:
        description: 'Cores Removed count from the reviewed preview'
        type: number
        default: 0
      expected_alternative_mra_removals:
        description: 'Alternative MRA Removed count from the reviewed preview'
        type: number
        default: 0
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: write

concurrency:
  group: pgm-artifact-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.PGM_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preservation repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Test synchronization safety
        run: python3 -B -m unittest discover -s tests -p 'test_pgm_sync.py' -v
      - name: Synchronize validated artifacts
        env:
          PGM_SOURCE_URL: ${{ secrets.PGM_SOURCE_URL }}
          GIT_TERMINAL_PROMPT: '0'
          SYNC_EVENT: ${{ github.event_name }}
          SYNC_APPLY: ${{ inputs.apply }}
          EXPECTED_MRA_REMOVALS: ${{ inputs.expected_mra_removals }}
          EXPECTED_CORE_REMOVALS: ${{ inputs.expected_core_removals }}
          EXPECTED_ALTERNATIVE_MRA_REMOVALS: ${{ inputs.expected_alternative_mra_removals }}
        shell: bash
        run: |
          args=()
          if [[ "$SYNC_EVENT" == "schedule" ]]; then
            args+=(--apply --scheduled)
          elif [[ "$SYNC_APPLY" == "true" ]]; then
            args+=(--apply --expected-mra-removals "$EXPECTED_MRA_REMOVALS")
            args+=(--expected-core-removals "$EXPECTED_CORE_REMOVALS")
            args+=(--expected-alternative-mra-removals "$EXPECTED_ALTERNATIVE_MRA_REMOVALS")
          fi
          python3 -B scripts/sync_pgm_artifacts.py "${args[@]}"
